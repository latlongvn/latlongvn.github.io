<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Map - Europe & Asia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Initialize map centered between Europe and Asia
  var map = L.map('map').setView([35.5, 60.0], 3.2);

  // Esri Satellite Layer
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri, Maxar, Earthstar Geographics',
    maxZoom: 19
  }).addTo(map);

  // Esri Reference Overlay
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri',
    maxZoom: 19
  }).addTo(map);

  // Function to add labeled markers
  function addLabel(lat, lon, label) {
    L.marker([lat, lon])
      .addTo(map)
      .bindTooltip(label, { permanent: true, direction: 'top', offset: [0, -10] })
      .openTooltip();
  }

  // Add selected global markers
  addLabel(48.0167, -2.1833, "Otto & Wil");       // Paimpont, France
  addLabel(52.3676, 4.9041, "Elke");              // Amsterdam, Netherlands
  addLabel(16.0544, 108.2022, "Leon");            // Da Nang, Vietnam

</script>

</body>
</html>
